# Solid Queue recurring schedule (docs/PLAN.md § Price pipeline / § Trading
# calendar & time). Price-pipeline jobs are scheduled DAILY x7 pinned to
# America/New_York — never a weekday cron, which misfires around midnight when
# the supervisor clock is UTC. Each job self-gates non-trading days, so a daily
# fire that no-ops is cheaper and safer than a fragile weekday mask.
#
# Cron strings carry an explicit "America/New_York" timezone token (Fugit
# parses the trailing zone), so the schedule holds across DST regardless of the
# host clock.

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  daily_price_sync:
    class: Prices::DailySyncJob
    queue: default
    # 22:00 ET nightly, every day — after the US EOD data lands; weekends/holidays no-op.
    schedule: "0 22 * * * America/New_York"

  instrument_metadata_refresh:
    command: "Instruments::MetadataJob.refresh_all"
    queue: default
    # Sector/industry are cached forever; refresh on the 1st of each month at 04:00 ET.
    schedule: "0 4 1 * * America/New_York"

  directory_import:
    class: Directory::ImportJob
    queue: default
    # Tiingo's supported_tickers bulk file changes slowly; import Sundays at 03:00 ET.
    schedule: "0 3 * * 0 America/New_York"

  recurring_materializer:
    class: Recurring::MaterializeDueJob
    queue: default
    # 22:30 ET nightly, every day — after the 22:00 price sync starts landing
    # closes. A slot whose close hasn't landed yet is retried the next night
    # (the catch-up loop), so ordering is a latency optimization, not a
    # correctness requirement.
    schedule: "30 22 * * * America/New_York"
