name: portfolio_view

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_view_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433: 5432 is commonly taken by other local Postgres
      # instances. In-network services still connect to db:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ruby:3.4
    working_dir: /app
    # rm -f server.pid: a stale pidfile on the bind mount (left by any unclean
    # container shutdown) otherwise aborts boot with "A server is already running".
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      PGHOST: db
      PGUSER: portfolio
      PGPASSWORD: portfolio
      SOLID_QUEUE_IN_PUMA: "true"
      TZ: America/New_York
      # Invite-gated registration (backlog #006). Override on the host to
      # change it; registration is closed if this is ever blank.
      INVITE_CODE: ${INVITE_CODE:-dev-invite-code}
      # Market-data provider API keys (backlog M2). Read from the host env /
      # .env file; blank by default so the stack still boots without them.
      # Adapters read these from ENV and never log them (see .env.example).
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  vite:
    image: node:22
    working_dir: /app/frontend
    command: bash -c "npm install && npm run dev"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://web:3000
    ports:
      - "5173:5173"
    depends_on:
      - web

  # End-to-end smoke suite (backlog #047 / issue #51). Behind a profile so it
  # never starts with a plain `docker compose up`; run it with:
  #
  #   docker compose --profile e2e run --rm e2e
  #
  # Joins the compose network and talks to `vite:5173` / `web:3000` directly, so
  # it publishes no host ports and cannot collide with the dev stack. The image
  # tag MUST track the @playwright/test version in e2e/package.json — Playwright
  # refuses to run against mismatched bundled browsers.
  e2e:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    profiles: ["e2e"]
    working_dir: /app/e2e
    command: bash -c "npm install --no-audit --no-fund && npm test"
    volumes:
      - .:/app
      - e2e_node_modules:/app/e2e/node_modules
    environment:
      E2E_BASE_URL: http://vite:5173
      # Must match the web service's invite code or registration is refused.
      INVITE_CODE: ${INVITE_CODE:-dev-invite-code}
    depends_on:
      - vite

volumes:
  pgdata:
  bundle_cache:
  frontend_node_modules:
  e2e_node_modules:
