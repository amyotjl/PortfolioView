name: portfolio_view

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_view_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433: 5432 is commonly taken by other local Postgres
      # instances. In-network services still connect to db:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ruby:3.4
    working_dir: /app
    # rm -f server.pid: a stale pidfile on the bind mount (left by any unclean
    # container shutdown) otherwise aborts boot with "A server is already running".
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      PGHOST: db
      PGUSER: portfolio
      PGPASSWORD: portfolio
      SOLID_QUEUE_IN_PUMA: "true"
      TZ: America/New_York
      # Invite-gated registration (backlog #006). Override on the host to
      # change it; registration is closed if this is ever blank.
      INVITE_CODE: ${INVITE_CODE:-dev-invite-code}
      # Bearer token for POST /api/internal/jobs/daily_sync (issue #56). Blank
      # by default and blank means CLOSED, so the `:-` default is safe here
      # (unlike INVITE_CODE, whose blank-masking is called out in PLAN.md).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Market-data provider API keys (backlog M2). Read from the host env /
      # .env file; blank by default so the stack still boots without them.
      # Adapters read these from ENV and never log them (see .env.example).
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  vite:
    image: node:22
    working_dir: /app/frontend
    command: bash -c "npm install && npm run dev"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://web:3000
    ports:
      - "5173:5173"
    depends_on:
      - web

  # End-to-end smoke suite (backlog #047 / issue #51). Behind a profile so it
  # never starts with a plain `docker compose up`; run it with:
  #
  #   docker compose --profile e2e run --rm e2e
  #
  # Joins the compose network and talks to `vite:5173` / `web:3000` directly, so
  # it publishes no host ports and cannot collide with the dev stack. The image
  # tag MUST track the @playwright/test version in e2e/package.json — Playwright
  # refuses to run against mismatched bundled browsers.
  e2e:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    profiles: ["e2e"]
    working_dir: /app/e2e
    command: bash -c "npm install --no-audit --no-fund && npm test"
    volumes:
      - .:/app
      - e2e_node_modules:/app/e2e/node_modules
    environment:
      E2E_BASE_URL: http://vite:5173
      # Must match the web service's invite code or registration is refused.
      INVITE_CODE: ${INVITE_CODE:-dev-invite-code}
    depends_on:
      - vite

  # ---------------------------------------------------------------------------
  # Production profile (docs/PLAN.md § Deployment, backlog #054)
  # ---------------------------------------------------------------------------
  # Two services behind `profiles: ["production"]`, so they never start with a
  # plain `docker compose up`. Bring them up by name — naming the services is
  # what keeps the profile-less dev services (which would fight over :3000)
  # out of it:
  #
  #   docker compose --profile production up --build -d db-prod web-prod
  #
  # Required env (see .env.example / README.md § Production). None of these
  # carry a `:-default`: production must fail closed rather than boot with a
  # dev-shaped secret. They are also NOT declared with compose's `:?` error
  # syntax, because interpolation runs at file-parse time for every service —
  # including profiled ones — which would break `docker compose up` for the dev
  # stack whenever they are unset.
  #   SECRET_KEY_BASE        Rails message verifier / signed cookies
  #   APP_DATABASE_PASSWORD  role "app" (config/database.yml production block)
  #   INVITE_CODE            registration is closed while this is blank
  db-prod:
    profiles: ["production"]
    image: postgres:16
    environment:
      # Must match config/database.yml's production username, and the database
      # name its primary entry expects. db:prepare creates the sibling
      # app_production_cache / _queue / _cable databases (multi-DB layout is
      # required by Solid Queue/Solid Cache — don't collapse it).
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD}
      POSTGRES_DB: app_production
    volumes:
      # Named volume, separate from the dev `pgdata`: production data survives
      # `docker compose down` and container replacement.
      - pgdata_production:/var/lib/postgresql/data
    # Deliberately publishes no host port: nothing outside the compose network
    # needs to reach the production database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_production"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web-prod:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolioview-web:production
    # Dockerfile CMD: `./bin/thrust ./bin/rails server`. bin/docker-entrypoint
    # clears any stale tmp/pids/server.pid and runs `db:prepare` before exec'ing
    # it, so migrations are applied on every boot including the first one.
    environment:
      RAILS_ENV: production
      TZ: America/New_York
      # libpq picks the host up from PGHOST; database.yml supplies user/password.
      PGHOST: db-prod
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # Solid Queue supervisor runs inside Puma (config/puma.rb) — single-box
      # deploy, no separate worker container, no Redis.
      SOLID_QUEUE_IN_PUMA: "true"
      # No `:-` default here, unlike the dev service: PLAN.md § Deployment
      # requires production to fail closed on a blank invite code.
      INVITE_CODE: ${INVITE_CODE}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      # Guards every /api/internal route (the cron / curl sync trigger).
      # Omitting this line is how #58 found the whole namespace unreachable in
      # production: Api::Internal::BaseController fails closed on a blank var,
      # so the endpoint answered 401 to the CORRECT token exactly as it does to
      # a wrong one — indistinguishable from a token mismatch, and invisible to
      # #56's gate (which tested the endpoint) and #54's (which tested the
      # image), because neither owned the compose wiring between them.
      #
      # `:-` default, unlike INVITE_CODE above: an unset token means "internal
      # namespace disabled", which is a legitimate deployment choice — the
      # Settings Sync-now button uses session auth and needs no token. Blank is
      # closed, not open, so this is safe to default.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    ports:
      # Thruster listens on :80 inside the container and proxies to Puma;
      # PLAN.md pins the app to http://localhost:3000 on the host.
      - "3000:80"
    depends_on:
      db-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  pgdata_production:
  bundle_cache:
  frontend_node_modules:
  e2e_node_modules:
